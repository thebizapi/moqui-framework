name: Docker Image CI

on:
  push:
    branches: ["thebizapi"]
  pull_request:
    branches: ["thebizapi"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build the Docker image
      run: |
        echo "${{ secrets.PRIVATE_SSH_KEY }}" > id_ed25519
        chmod 600 id_ed25519
        ssh-add id_ed25519
        ./gradlew getRu

    - name: Cache OpenSearch
      uses: actions/cache@v4
      with:
        path: runtime/opensearch
        key: opensearch-${{ runner.os }}-${{ hashFiles('build.gradle') }}
        restore-keys: |
          opensearch-${{ runner.os }}-

    - name: Cache JavaScript build artifacts
      uses: actions/cache@v4
      with:
        path: |
          runtime/base-component/webroot/screen/webroot/libs
        key: js-${{ runner.os }}-${{ hashFiles('runtime/base-component/webroot/build.gradle') }}
        restore-keys: |
          js-${{ runner.os }}-

    - name: Build the Docker image
      run: |
        echo "${{ secrets.PRIVATE_SSH_KEY }}" > id_ed25519
        chmod 600 id_ed25519
        ssh-add id_ed25519
        ./gradlew getCompSet -PcomponentSet=thebizapi dOS addRu
        cd docker/simple
        ./docker-build.sh ../.. thebizapi/thebizapi:$(date +%s)
