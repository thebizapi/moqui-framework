name: Docker Image CI

on:
  push:
    branches: ["thebizapi"]
  pull_request:
    branches: ["thebizapi"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build the Docker image
      run: |
        eval "$(ssh-agent -s)"
        echo "${{ secrets.PRIVATE_SSH_KEY }}" > ~/.ssh/id_ed25519
        ssh-add ~/.ssh/id_ed25519
        ls -al ~/.ssh
        ssh -T git@github.com
        # /usr/bin/git config --list --global
        # curl -s "https://get.sdkman.io" | bash
        # source "/home/runner/.sdkman/bin/sdkman-init.sh"
        # sdk install java 11.0.24-tem
        sed -i 's/github-ssh/github/' myaddons.xml
        ./gradlew getRu 
        cd runtime/component
        git clone git@github.com:thebizapi/thebizapi
        cd ../..
        ./gradlew getDepends dOS addRu
        # cd docker/simple
        # ./docker-build.sh ../.. thebizapi/thebizapi:$(date +%s)
